name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SRC_URL: https://aka.doubaocdn.com/s/NtFUV7c7pQ

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: 拉取工程源码
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/src.zip "$SRC_URL"
          unzip -q /tmp/src.zip -d "$GITHUB_WORKSPACE"
          find ios -maxdepth 3 -name '*.swift' -o -maxdepth 3 -name '*.pbxproj' | sort

      - name: 检查 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 生成应用图标
        run: |
          python3 - <<'PY'
          import zlib, struct
          W = H = 1024
          bg = (18, 22, 27, 255)
          green = (61, 220, 151, 255)
          red = (255, 77, 79, 255)
          rows = []
          for y in range(H):
              line = bytearray()
              for x in range(W):
                  d = ((x - 512) ** 2 + (y - 520) ** 2) ** 0.5
                  if 250 <= d <= 292 or d <= 88:
                      line += bytes(green)
                  elif (x - 820) ** 2 + (y - 200) ** 2 <= 55 ** 2:
                      line += bytes(red)
                  elif abs(y - 760) <= 9 and 200 <= x <= 824:
                      line += bytes((235, 240, 240, 255))
                  else:
                      line += bytes(bg)
              rows.append(bytes(line))
          raw = b''.join(b'\x00' + r for r in rows)

          def chunk(tag, data):
              return tag + struct.pack('>I', len(data)) + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          path = 'ios/DashCamIOS/DashCamIOS/Assets.xcassets/AppIcon.appiconset/icon-1024.png'
          open(path, 'wb').write(png)
          print('icon bytes', len(png))
          PY

      - name: 编译（不签名）
        run: |
          bash ios/build_ipa.sh verify

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP=$(find ios/build/DerivedData/Build/Products -maxdepth 2 -name 'DashCamIOS.app' -type d | head -1)
          echo "APP=$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry -y DashCamIOS-unsigned.ipa Payload
          unzip -l DashCamIOS-unsigned.ipa | head -20
          ls -lh DashCamIOS-unsigned.ipa

      - name: 校验产物
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Payload/DashCamIOS.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' dist/Payload/DashCamIOS.app/Info.plist
          file dist/Payload/DashCamIOS.app/DashCamIOS

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-ipa
          path: dist/DashCamIOS-unsigned.ipa

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DashCam iOS build ${{ github.run_number }}
          body: 未签名 IPA（ARM64 真机包）。需用 Sideloadly 或 Xcode 重新签名后才能安装。
          files: dist/DashCamIOS-unsigned.ipa
