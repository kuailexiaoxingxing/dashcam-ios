name: Build unsigned IPA

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

env:
  SRC_URL: https://aka.doubaocdn.com/s/no1EP1cqtK

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 拉取工程源码
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/src.zip "$SRC_URL"
          unzip -q /tmp/src.zip -d "$GITHUB_WORKSPACE"
          ls ios/DashCamIOS/DashCamIOS

      - name: 检查 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 编译（不签名）
        run: |
          set +e
          bash ios/build_ipa.sh verify 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "build exit=$code"
          exit $code

      - name: 回推编译日志
        if: failure()
        run: |
          set -euo pipefail
          tail -n 600 /tmp/build.log > ci-log.txt || true
          git config user.email ci@dashcam.local
          git config user.name ci
          git checkout -B ci-log
          git add ci-log.txt
          git commit -m "ci log $GITHUB_RUN_NUMBER" || true
          git push -f origin ci-log

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP=$(find ios/build/DerivedData/Build/Products -maxdepth 2 -name 'DashCamIOS.app' -type d | head -1)
          echo "APP=$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry -y DashCamIOS-unsigned.ipa Payload
          unzip -l DashCamIOS-unsigned.ipa | head -20
          ls -lh DashCamIOS-unsigned.ipa

      - name: 校验产物
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Payload/DashCamIOS.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' dist/Payload/DashCamIOS.app/Info.plist
          file dist/Payload/DashCamIOS.app/DashCamIOS
          ls dist/Payload/DashCamIOS.app | head -20

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-ipa
          path: dist/DashCamIOS-unsigned.ipa

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DashCam iOS build ${{ github.run_number }}
          body: 未签名 IPA（ARM64 真机包）。需用 Sideloadly 或 Xcode 重新签名后才能安装。
          files: dist/DashCamIOS-unsigned.ipa
